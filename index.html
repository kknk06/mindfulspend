    .secondary,.ghost,.theme-option,.filter,.type-choice,.close-btn,.file-input::file-selector-button{background-color:rgba(255,255,255,.055);border-color:rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .primary{background:linear-gradient(135deg,rgba(250,202,220,.94),rgba(231,137,173,.92));border:1px solid rgba(255,255,255,.4);box-shadow:0 8px 24px rgba(226,125,164,.2),inset 0 1px rgba(255,255,255,.62)}
    .search input,.field{background:rgba(16,12,22,.48);border-color:rgba(255,255,255,.15);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    dialog{background:rgba(34,25,40,.86);border-color:rgba(255,255,255,.17);backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%)}
    .toast{background:rgba(42,32,48,.83);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .mobile-nav{background:rgba(24,18,30,.76);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);border-top-color:rgba(255,255,255,.14)}
    @media(max-width:720px){.sidebar{display:none}}
    @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.profile,.side-note,.date-chip,.goal-mini,.mood-tile,.privacy-note{background-color:rgba(40,30,48,.94)}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <button class="profile" id="profileButton" type="button" aria-label="編輯個人檔案"><img class="avatar" id="avatar" alt="" hidden><span class="avatar" id="avatarFallback">🎀</span><span class="profile-meta"><span class="profile-name" id="profileName">地雷ちゃん</span><span class="profile-hint">管理個人檔案</span></span><span class="icon" aria-hidden="true">⌄</span></button>
      <div class="nav-label">工作空間</div>
      <nav class="nav" id="sideNav" aria-label="主要導覽"></nav>
      <div class="sidebar-bottom"><div class="side-note"><div class="side-note-title">給今天的自己一點餘裕</div><p>每一筆紀錄，都是更理解自己的開始。</p></div><button class="primary wide" data-action="new-tx"><span class="icon">＋</span> 記一筆帳目</button></div>
    </aside>
    <main class="content">
      <header class="topbar"><div><div class="eyebrow" id="eyebrow">YOUR MONEY, YOUR MOOD</div><h1 class="page-title" id="pageTitle">總覽主頁</h1><p class="page-subtitle" id="pageSubtitle">溫柔記錄日常，慢慢找回生活的掌控感。</p></div><div class="top-actions"><div class="date-chip"><span class="icon">◷</span><span id="todayLabel"></span></div><button class="primary" data-action="new-tx"><span class="icon">＋</span><span>新增紀錄</span></button></div></header>
      <section class="view active" id="view-overview" aria-label="總覽"></section>
      <section class="view" id="view-transactions" aria-label="記帳明細"></section>
      <section class="view" id="view-insights" aria-label="消費分析"></section>
      <section class="view" id="view-goals" aria-label="存錢目標"></section>
      <section class="view" id="view-settings" aria-label="設定"></section>
      <div class="footnote">你的紀錄安全儲存在這台裝置的瀏覽器中。</div>
    </main>
  </div>
  <nav class="mobile-nav" id="mobileNav" aria-label="手機導覽"></nav>

  <dialog id="txDialog"><div class="dialog-inner"><div class="dialog-head"><h2>新增一筆紀錄</h2><button class="close-btn" data-close="txDialog" aria-label="關閉">×</button></div><form id="txForm"><div class="radio-row"><button type="button" class="type-choice active" data-type="expense">− 支出</button><button type="button" class="type-choice" data-type="income">＋ 收入</button></div><input type="hidden" id="txType" value="expense"><div class="form-group"><label class="field-label" for="txAmount">金額（NT$）</label><input class="field" id="txAmount" type="number" min="1" step="1" placeholder="輸入金額" required></div><div class="form-group"><label class="field-label" for="txCategory">分類</label><select class="field" id="txCategory"><option>周邊應援</option><option>餐飲美食</option><option>日常開銷</option><option>服飾美妝</option><option>交通移動</option><option>娛樂休閒</option><option>薪資收入</option><option>其他</option></select></div><div class="form-group"><label class="field-label" for="txNote">備註</label><input class="field" id="txNote" maxlength="80" placeholder="例如：限定拍立得、午餐"></div><div class="form-group"><label class="field-label" for="txMood">當下心情</label><select class="field" id="txMood"><option value="🥰">🥰 幸福滿足</option><option value="😭">😭 有點憂鬱</option><option value="💸">💸 衝動購物</option><option value="🫠">🫠 疲憊放鬆</option><option value="😌">😌 平靜日常</option></select></div><div class="dialog-actions"><button type="button" class="ghost" data-close="txDialog">取消</button><button class="primary" type="submit">儲存紀錄</button></div></form></div></dialog>
  <dialog id="goalDialog"><div class="dialog-inner"><div class="dialog-head"><h2>建立存錢目標</h2><button class="close-btn" data-close="goalDialog" aria-label="關閉">×</button></div><form id="goalForm"><div class="form-group"><label class="field-label" for="goalTitle">夢想名稱</label><input class="field" id="goalTitle" maxlength="60" placeholder="例如：喜歡的限定洋裝" required></div><div class="form-group"><label class="field-label" for="goalTarget">目標金額（NT$）</label><input class="field" id="goalTarget" type="number" min="1" step="1" placeholder="18000" required></div><div class="form-group"><label class="field-label" for="goalCurrent">已存金額（NT$）</label><input class="field" id="goalCurrent" type="number" min="0" step="1" placeholder="0" value="0"></div><div class="dialog-actions"><button type="button" class="ghost" data-close="goalDialog">取消</button><button class="primary" type="submit">建立目標</button></div></form></div></dialog>
  <dialog id="depositDialog"><div class="dialog-inner"><div class="dialog-head"><h2>為夢想存一筆</h2><button class="close-btn" data-close="depositDialog" aria-label="關閉">×</button></div><form id="depositForm"><input type="hidden" id="depositGoalId"><p id="depositGoalName" class="page-subtitle" style="margin:0 0 14px"></p><div class="form-group"><label class="field-label" for="depositAmount">存入金額（NT$）</label><input class="field" id="depositAmount" type="number" min="1" step="1" placeholder="500" required></div><div class="dialog-actions"><button type="button" class="ghost" data-close="depositDialog">取消</button><button class="primary" type="submit">確認存入</button></div></form></div></dialog>
  <dialog id="profileDialog"><div class="dialog-inner"><div class="dialog-head"><h2>個人檔案</h2><button class="close-btn" data-close="profileDialog" aria-label="關閉">×</button></div><form id="profileForm"><div class="form-group"><label class="field-label" for="profileInput">顯示名稱</label><input class="field" id="profileInput" maxlength="32" placeholder="輸入暱稱"></div><div class="form-group"><label class="field-label" for="avatarInput">個人頭像</label><input class="file-input" id="avatarInput" type="file" accept="image/*"></div><div class="dialog-actions"><button type="button" class="ghost" data-close="profileDialog">取消</button><button class="primary" type="submit">儲存變更</button></div></form></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden><span>✦</span><span id="toastText"></span></div>

  <script>
    (()=>{
      const STORAGE_KEY='mindfulspend_site_v1';
      const navItems=[['overview','◫','總覽主頁'],['transactions','≡','明細與搜尋'],['insights','✧','消費模式觀察'],['goals','◎','夢想存款'],['settings','⚙','設定與備份']];
      const pageInfo={overview:['總覽主頁','溫柔記錄日常，慢慢找回生活的掌控感。'],transactions:['明細與搜尋','每一筆花費都看得清楚，整理起來更安心。'],insights:['消費模式觀察','看看心情與花費之間，最近有什麼小線索。'],goals:['夢想存款','把喜歡的事一點一點存進未來。'],settings:['設定與備份','依照你的習慣調整帳本，並匯出個人資料。']};
      const moodNames={'🥰':'幸福滿足','😭':'有點憂鬱','💸':'衝動購物','🫠':'疲憊放鬆','😌':'平靜日常'};
      const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
      const safeRead=()=>{try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);return {...defaultState(),...parsed}}}catch(e){}return defaultState()};
      function defaultState(){return {profile:{name:'地雷ちゃん',avatar:''},budget:25000,transactions:[],goals:[{id:1,title:'地雷系限定連身裙 🎀',target:18000,current:6500}],wallpaper:''}}
      let state=safeRead(),active='overview',query='',filter='全部',toastTimer;
      const save=()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){showToast('瀏覽器儲存空間不足，請移除較大的背景圖片')}};
      const fmt=n=>new Intl.NumberFormat('zh-TW',{maximumFractionDigits:0}).format(Math.round(Number(n)||0));
      const money=n=>'NT$ '+fmt(n);
      const monthKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`};
      const currentMonth=()=>monthKey(new Date());
      const monthTx=()=>state.transactions.filter(t=>monthKey(t.createdAt)===currentMonth());
      const expenses=()=>monthTx().filter(t=>t.type==='expense');
      const income=()=>monthTx().filter(t=>t.type==='income');
      const sum=list=>list.reduce((a,t)=>a+Number(t.amount||0),0);
      const dateText=d=>new Intl.DateTimeFormat('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(d));
      const monthText=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long'}).format(new Date());
      const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const iconFor=cat=>({'周邊應援':'🎀','餐飲美食':'☕','日常開銷':'🧺','服飾美妝':'🪞','交通移動':'🚇','娛樂休閒':'🎟️','薪資收入':'✦','其他':'✧'}[cat]||'✧');
      function showToast(msg){$('#toastText').textContent=msg;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2600)}
      function navMarkup(){return navItems.map(([id,ico,label])=>`<button class="nav-btn ${active===id?'active':''}" data-nav="${id}" ${active===id?'aria-current="page"':''}><span class="icon" aria-hidden="true">${ico}</span><span>${label}</span>${id==='transactions'&&state.transactions.length?`<span class="nav-count">${state.transactions.length}</span>`:''}</button>`).join('')}
      function applyWallpaper(){document.body.style.backgroundImage=state.wallpaper?`linear-gradient(rgba(18,14,24,.86),rgba(18,14,24,.94)),url("${state.wallpaper}")`:'';document.body.style.backgroundSize=state.wallpaper?'cover':'';document.body.style.backgroundPosition=state.wallpaper?'center':'';document.body.style.backgroundAttachment=state.wallpaper?'fixed':''}
      function shell(){ applyWallpaper();$('#sideNav').innerHTML=navMarkup();$('#mobileNav').innerHTML=navMarkup();$('#profileName').textContent=state.profile.name||'我的帳本';if(state.profile.avatar){$('#avatar').src=state.profile.avatar;$('#avatar').hidden=false;$('#avatarFallback').hidden=true}else{$('#avatar').hidden=true;$('#avatarFallback').hidden=false}$('#todayLabel').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());$('#pageTitle').textContent=pageInfo[active][0];$('#pageSubtitle').textContent=pageInfo[active][1];$('#eyebrow').textContent=active==='overview'?monthText.toUpperCase():'MINDFULSPEND';$$('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${active}`));renderView() }
      function setPage(page){active=page;query='';filter='全部';shell();window.scrollTo({top:0,behavior:'smooth'})}
      function renderView(){if(active==='overview')renderOverview();if(active==='transactions')renderTransactions();if(active==='insights')renderInsights();if(active==='goals')renderGoals();if(active==='settings')renderSettings()}
      function categoryBreakdown(list){const map={};list.forEach(t=>map[t.category]=(map[t.category]||0)+Number(t.amount));return Object.entries(map).sort((a,b)=>b[1]-a[1])}
      function txItem(t){return `<div class="transaction"><span class="tx-symbol">${esc(t.mood||iconFor(t.category))}</span><div class="tx-info"><div class="tx-title">${esc(t.note||t.category)}</div><div class="tx-meta"><span>${esc(dateText(t.createdAt))}</span><span class="tag">${esc(t.category)}</span></div></div><div class="tx-amount ${t.type==='income'?'income':'expense'}">${t.type==='income'?'+':'−'}${money(t.amount)}</div></div>`}
      function renderOverview(){const list=monthTx(),inc=sum(list.filter(t=>t.type==='income')),out=sum(list.filter(t=>t.type==='expense')),balance=inc-out,pct=Math.min(100,state.budget?out/state.budget*100:0),cats=categoryBreakdown(list.filter(t=>t.type==='expense')).slice(0,5),moods=Object.keys(moodNames).map(m=>({m,list:list.filter(t=>t.type==='expense'&&t.mood===m)}));const recent=[...state.transactions].sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);const goals=state.goals.slice(0,2);
        $('#view-overview').innerHTML=`<div class="grid metrics"><article class="card metric" style="--icon-color:var(--green);--icon-bg:rgba(139,216,178,.12);--glow:rgba(139,216,178,.08)"><div class="metric-top"><span class="metric-icon">↗</span>本月收入</div><div class="metric-value">${money(inc)}</div><div class="metric-caption">本月入帳金額</div></article><article class="card metric" style="--icon-color:var(--red);--icon-bg:rgba(242,142,158,.12);--glow:rgba(242,142,158,.08)"><div class="metric-top"><span class="metric-icon">↘</span>本月支出</div><div class="metric-value">${money(out)}</div><div class="metric-caption">本月消費金額</div></article><article class="card metric"><div class="metric-top"><span class="metric-icon">◇</span>本月結餘</div><div class="metric-value ${balance>=0?'':'expense'}">${money(balance)}</div><div class="metric-caption">收入扣除支出</div></article></div>
        <div class="section-heading"><div><h2>預算使用進度</h2><p>掌握本月消費步調，留一點空間給自己。</p></div><button class="section-link" data-action="budget">調整預算 →</button></div>
        <article class="card budget-card"><div class="budget-head"><div><div class="budget-title">${monthText}預算</div><div class="budget-caption">已使用 ${Math.round(pct)}% 的預算</div></div><div class="budget-number">${money(out)}<span>預算 ${money(state.budget)}</span></div></div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div><div class="budget-foot"><span>${out>state.budget?'已超出預算 '+money(out-state.budget):'尚可使用 '+money(Math.max(0,state.budget-out))}</span><span>${monthText}</span></div></article>
        <div class="section-heading"><div><h2>本月收支概況</h2><p>從分類與當下心情，看看最近的消費節奏。</p></div></div>
        <div class="grid split"><article class="card panel"><div class="panel-head"><div><div class="panel-title">支出分類</div><div class="panel-description">本月各分類的支出比例</div></div><button class="section-link" data-nav="transactions">查看明細 →</button></div>${cats.length?`<div class="category-list">${cats.map(([name,val])=>`<div class="category-row"><span class="category-label">${esc(name)}</span><div class="category-track"><div class="category-fill" style="width:${out?Math.max(3,val/out*100):0}%"></div></div><span class="category-value">${money(val)}</span></div>`).join('')}</div>`:`<div class="empty"><div class="empty-symbol">✧</div>還沒有支出紀錄，記下第一筆消費，觀察就會慢慢開始。</div>`}</article><article class="card panel"><div class="panel-head"><div><div class="panel-title">消費時的心情</div><div class="panel-description">用一個表情照顧當下的自己</div></div></div><div class="mood-grid">${moods.map(({m,list})=>`<div class="mood-tile"><div class="mood-tile-top"><span>${m} ${moodNames[m]}</span><span>${list.length} 筆</span></div><div class="mood-amount">${money(sum(list))}</div><div class="mood-count">本月支出</div></div>`).join('')}</div></article></div>
        <div class="section-heading"><div><h2>最近的記帳紀錄</h2><p>讓每一筆花費都有跡可循。</p></div><button class="section-link" data-nav="transactions">全部紀錄 →</button></div><article class="card panel">${recent.length?`<div class="transaction-list">${recent.map(txItem).join('')}</div>`:`<div class="empty"><div class="empty-symbol">🎀</div>這裡會顯示最新的紀錄。<br>準備好時，按下「新增紀錄」開始即可。</div>`}</article>
        ${goals.length?`<div class="section-heading"><div><h2>正在存下的夢想</h2><p>小小的累積，也值得被看見。</p></div><button class="section-link" data-nav="goals">管理目標 →</button></div><div class="grid goals-grid">${goals.map(g=>{const p=Math.min(100,Math.round(g.current/g.target*100));return `<article class="goal-mini"><div class="goal-mini-head"><span>${esc(g.title)}</span><span class="goal-percent">${p}%</span></div><div class="goal-mini-amount">${money(g.current)} / ${money(g.target)}</div><div class="progress"><div class="progress-bar" style="width:${p}%"></div></div></article>`}).join('')}</div>`:''}` }
      function renderTransactions(){let rows=[...state.transactions].sort((a,b)=>b.createdAt-a.createdAt);if(filter==='支出')rows=rows.filter(t=>t.type==='expense');if(filter==='收入')rows=rows.filter(t=>t.type==='income');if(query.trim()){const q=query.trim().toLowerCase();rows=rows.filter(t=>`${t.note} ${t.category} ${t.mood}`.toLowerCase().includes(q))}$('#view-transactions').innerHTML=`<div class="toolbar"><label class="search"><span class="icon">⌕</span><input id="searchInput" type="search" placeholder="搜尋備註或分類…" value="${esc(query)}" aria-label="搜尋記帳紀錄"></label><div class="filters">${['全部','支出','收入'].map(f=>`<button class="filter ${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div></div><article class="card table-card"><div class="table-head"><span>項目</span><span>分類</span><span>日期</span><span>金額</span><span></span></div>${rows.length?rows.map(t=>`<div class="table-row"><div class="table-desc"><span class="tx-symbol">${esc(t.mood||iconFor(t.category))}</span><span class="tx-info"><span class="tx-title">${esc(t.note||t.category)}</span><span class="tx-meta">${esc(t.mood?moodNames[t.mood]||'心情已記錄':'心情未記錄')}</span></span></div><span class="table-category">${esc(t.category)}</span><span class="table-date">${esc(dateText(t.createdAt))}</span><span class="table-type ${t.type==='income'?'income':'expense'}">${t.type==='income'?'+':'−'}${money(t.amount)}</span><button class="delete-btn" data-delete-tx="${t.id}" aria-label="刪除 ${esc(t.note||t.category)}">×</button></div>`).join(''):`<div class="empty"><div class="empty-symbol">⌕</div>${query?'找不到符合條件的紀錄。':'目前還沒有紀錄。'}<br>新增一筆後，就可以在這裡搜尋與管理。</div>`}</article>`}
      function insightCopy(){const list=expenses(),total=sum(list),cats=categoryBreakdown(list),moods=Object.keys(moodNames).map(m=>({m,list:list.filter(t=>t.mood===m)})).sort((a,b)=>sum(b.list)-sum(a.list)),frequent=moods[0],impulse=list.filter(t=>t.mood==='💸'),top=cats[0];if(!list.length)return {title:'先從記下一筆開始，慢慢認識自己的消費節奏。',body:'當帳本累積一些日常紀錄後，這裡會整理最常出現的支出分類、消費時的心情，以及溫和可行的小建議。',cards:[['✧','留意消費情境','簡單記下當時的心情，幫助你回頭理解每一次選擇。'],['◷','先看趨勢，不急著評價','透過一段時間的紀錄，找到真正適合自己的理財步調。'],['♡','為重要的事保留餘裕','設定一個喜歡的存錢目標，讓消費與期待取得平衡。']]};let title=top?`目前支出較多的分類是「${top[0]}」，共 ${money(top[1])}。`:'已經開始建立本月消費紀錄。';let body=frequent&&sum(frequent.list)>0?`最常記錄的消費心情是「${moodNames[frequent.m]}」。本月共記錄 ${list.length} 筆支出，合計 ${money(total)}。這些資訊可以當作觀察線索，不代表對消費習慣的評價。`:`本月共記錄 ${list.length} 筆支出，合計 ${money(total)}。持續記錄，就能更清楚知道哪些消費帶給自己滿足。`;return {title,body,cards:[[top?'◫':'✧','主要支出分類',top?`${top[0]}目前占本月支出的 ${Math.round(top[1]/(total||1)*100)}%。回頭看看這些消費，是否符合近期的優先順序？`:'再累積幾筆消費後，就能看見主要支出分類。'],['♡','常見消費心情',frequent&&sum(frequent.list)>0?`「${moodNames[frequent.m]}」是目前較常出現的心情記錄。對自己保持好奇，比責備更有幫助。`:'下次記帳時選一個心情，觀察情緒與消費的關係。'],['⌁','溫柔的小提議',impulse.length?`本月標記「衝動購物」${impulse.length} 筆、共 ${money(sum(impulse))}。如果願意，可以先放進願望清單，隔天再決定。`:'購買前停一下，問問自己「這件事對現在的我重要嗎？」給選擇多一點空間。']]}}
      function renderInsights(){const x=insightCopy();$('#view-insights').innerHTML=`<article class="card insight-hero"><div class="insight-kicker">YOUR MONTHLY REFLECTION · ${esc(monthText)}</div><h2>${esc(x.title)}</h2><p>${esc(x.body)}</p></article><div class="grid insight-cards">${x.cards.map(([ico,title,body])=>`<article class="card insight-card"><span class="icon">${ico}</span><h3>${esc(title)}</h3><p>${esc(body)}</p></article>`).join('')}</div><div class="privacy-note">這些觀察根據本機帳本資料即時計算，不會送往外部服務，也不構成財務建議。</div>`}
      function renderGoals(){ $('#view-goals').innerHTML=`<div class="section-heading"><div><h2>為喜歡的生活慢慢存錢</h2><p>設定一個期待，讓每次小小的累積都看得見。</p></div><button class="primary" data-action="new-goal"><span class="icon">＋</span>新增目標</button></div>${state.goals.length?`<div class="grid goals-grid">${state.goals.map(g=>{const p=Math.min(100,Math.round(g.current/g.target*100)),left=Math.max(0,g.target-g.current);return `<article class="card goal-card"><div class="goal-top"><div class="goal-emoji">🎀</div><button class="delete-btn" data-delete-goal="${g.id}" aria-label="刪除目標 ${esc(g.title)}">×</button></div><div class="goal-name">${esc(g.title)}</div><div class="goal-target">目標金額 ${money(g.target)}</div><div class="progress"><div class="progress-bar" style="width:${p}%"></div></div><div class="goal-mini-head" style="margin-top:9px"><span>${money(g.current)} 已存</span><span class="goal-percent">${p}%</span></div><div class="goal-target">${left?`還差 ${money(left)}，一步一步就會更靠近。`:'恭喜達成這個夢想！'}</div><div class="goal-actions"><button class="secondary" data-deposit="${g.id}" data-amount="500">＋ 存入 500</button><button class="secondary" data-deposit="${g.id}" data-amount="1000">＋ 存入 1,000</button></div></article>`}).join('')}</div>`:`<article class="card empty"><div class="empty-symbol">◎</div>還沒有存錢目標。<br>新增第一個目標，讓期待有一個具體的方向。</article>`}` }
      function renderSettings(){$('#view-settings').innerHTML=`<div class="grid settings-grid"><article class="card settings-card"><h3>每月預算</h3><p>設定本月希望掌握的支出金額。</p><form class="settings-form" id="budgetForm"><input class="field" id="budgetInput" type="number" min="1" step="1" value="${Number(state.budget)||25000}" aria-label="每月預算"><button class="primary" type="submit">儲存</button></form></article><article class="card settings-card"><h3>個人桌布</h3><p>選一張喜歡的圖片，打造專屬帳本氛圍。</p><input class="file-input" id="wallpaperInput" type="file" accept="image/*"><div class="wallpaper-preview ${state.wallpaper?'show':''}" id="wallpaperPreview" style="${state.wallpaper?`background-image:url('${state.wallpaper}')`:''}"></div>${state.wallpaper?'<button class="ghost" style="margin-top:9px;padding:7px 10px;font-size:10px" data-action="clear-wallpaper">移除桌布</button>':''}</article><article class="card settings-card"><h3>資料備份</h3><p>將紀錄匯出為檔案，方便留存或整理。</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" data-action="export-csv">匯出 CSV 明細</button><button class="secondary" data-action="export-json">下載完整備份</button></div><div class="form-hint">資料目前只保存在此裝置的瀏覽器中。</div></article><article class="card settings-card"><h3>清除資料</h3><p>刪除這個瀏覽器裡的帳本紀錄與目標。</p><button class="danger" data-action="reset">清除帳本資料</button></article></div>`}
      function compress(file,maxWidth,quality){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,maxWidth/img.width),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',quality))};img.src=reader.result};reader.readAsDataURL(file)})}
      function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
      function exportCsv(){const rows=[['日期','收支類型','分類','備註','心情','金額'],...state.transactions.map(t=>[new Date(t.createdAt).toLocaleString('zh-TW'),t.type==='income'?'收入':'支出',t.category,t.note||'',moodNames[t.mood]||'',t.amount])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('MindfulSpend-記帳明細.csv',csv,'text/csv;charset=utf-8');showToast('已匯出 CSV 明細')}
      function openDialog(id){const d=$('#'+id);if(d&&!d.open)d.showModal()}
      function askDelete(message){return window.confirm(message)}
      document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){setPage(nav.dataset.nav);return}const action=e.target.closest('[data-action]');if(action){switch(action.dataset.action){case'new-tx':$('#txForm').reset();$('#txType').value='expense';$$('.type-choice').forEach(b=>b.classList.toggle('active',b.dataset.type==='expense'));$('#txCategory').value='周邊應援';openDialog('txDialog');break;case'new-goal':$('#goalForm').reset();$('#goalCurrent').value='0';openDialog('goalDialog');break;case'budget':setPage('settings');$('#budgetInput')?.focus();break;case'export-csv':exportCsv();break;case'export-json':download('MindfulSpend-完整備份.json',JSON.stringify(state,null,2),'application/json');showToast('已下載完整備份');break;case'clear-wallpaper':state.wallpaper='';save();applyWallpaper();renderSettings();showToast('已移除桌布');break;case'reset':if(askDelete('確定要清除這個瀏覽器中儲存的所有帳本資料嗎？此操作無法還原。')){localStorage.removeItem(STORAGE_KEY);state=defaultState();shell();showToast('帳本已恢復初始狀態')}break}return}const delTx=e.target.closest('[data-delete-tx]');if(delTx){if(askDelete('要刪除這筆記帳紀錄嗎？')){state.transactions=state.transactions.filter(t=>String(t.id)!==delTx.dataset.deleteTx);save();renderView();showToast('紀錄已刪除')}return}const delGoal=e.target.closest('[data-delete-goal]');if(delGoal){if(askDelete('要刪除這個存錢目標嗎？')){state.goals=state.goals.filter(g=>String(g.id)!==delGoal.dataset.deleteGoal);save();renderView();showToast('目標已刪除')}return}const dep=e.target.closest('[data-deposit]');if(dep){const goal=state.goals.find(g=>String(g.id)===dep.dataset.deposit);if(goal){$('#depositGoalId').value=goal.id;$('#depositGoalName').textContent=goal.title;$('#depositAmount').value=dep.dataset.amount;openDialog('depositDialog')}return}});
      $('#profileButton').addEventListener('click',()=>{$('#profileInput').value=state.profile.name||'';openDialog('profileDialog')});
      $$('[data-close]').forEach(b=>b.addEventListener('click',()=>$('#'+b.dataset.close).close()));
      $$('.type-choice').forEach(b=>b.addEventListener('click',()=>{$$('.type-choice').forEach(x=>x.classList.toggle('active',x===b));$('#txType').value=b.dataset.type;const isIncome=b.dataset.type==='income';if(isIncome&&['周邊應援','餐飲美食','日常開銷','服飾美妝','交通移動','娛樂休閒'].includes($('#txCategory').value))$('#txCategory').value='薪資收入';if(!isIncome&&$('#txCategory').value==='薪資收入')$('#txCategory').value='周邊應援'}));
      $('#txForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('#txAmount').value);if(!Number.isFinite(amount)||amount<=0)return;state.transactions.unshift({id:Date.now(),type:$('#txType').value,amount,category:$('#txCategory').value,note:$('#txNote').value.trim(),mood:$('#txMood').value,createdAt:Date.now()});save();$('#txDialog').close();shell();showToast('已記錄一筆帳目')});
      $('#goalForm').addEventListener('submit',e=>{e.preventDefault();const title=$('#goalTitle').value.trim(),target=Number($('#goalTarget').value),current=Number($('#goalCurrent').value)||0;if(!title||target<=0||current<0)return;state.goals.push({id:Date.now(),title,target,current});save();$('#goalDialog').close();shell();showToast('已建立存錢目標')});
      $('#depositForm').addEventListener('submit',e=>{e.preventDefault();const goal=state.goals.find(g=>String(g.id)===$('#depositGoalId').value),amount=Number($('#depositAmount').value);if(!goal||amount<=0)return;goal.current+=amount;save();$('#depositDialog').close();shell();showToast(`已存入 ${money(amount)}`)});
      $('#profileForm').addEventListener('submit',e=>{e.preventDefault();state.profile.name=$('#profileInput').value.trim()||'我的帳本';save();$('#profileDialog').close();shell();showToast('個人檔案已更新')});
      $('#avatarInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{state.profile.avatar=await compress(file,400,.78);save();shell();showToast('頭像已更新')}catch(err){showToast('圖片載入失敗，請重試')}});
      document.addEventListener('input',e=>{if(e.target.id==='searchInput'){query=e.target.value;const pos=e.target.selectionStart;renderTransactions();const input=$('#searchInput');input.focus();input.setSelectionRange(pos,pos)}});
      document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;renderTransactions()}});
      document.addEventListener('submit',e=>{if(e.target.id==='budgetForm'){e.preventDefault();const n=Number($('#budgetInput').value);if(n>0){state.budget=n;save();shell();showToast('每月預算已更新')}}});
      document.addEventListener('change',async e=>{if(e.target.id==='wallpaperInput'){const file=e.target.files?.[0];if(!file)return;try{state.wallpaper=await compress(file,1400,.7);save();applyWallpaper();renderSettings();showToast('桌布已更新')}catch(err){showToast('圖片載入失敗，請重試')}}});
      shell();
    })();
  </script>
</body>
</html>
